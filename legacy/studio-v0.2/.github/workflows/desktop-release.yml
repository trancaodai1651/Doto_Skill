name: Build Doto Skill (Windows + macOS Universal + Web)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - if: runner.os == 'Windows'
        run: |
          npm run desktop:prepare
          npm run desktop:verify
          npx tauri build --bundles nsis
      - if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npm run desktop:prepare:universal
          npm run desktop:verify
          npx tauri build --target universal-apple-darwin --bundles app,dmg
          APP='src-tauri/target/universal-apple-darwin/release/bundle/macos/Doto Skill.app'
          lipo "$APP/Contents/MacOS/doto-skill" -verify_arch x86_64 arm64
          lipo "$APP/Contents/Resources/node/node" -verify_arch x86_64 arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
