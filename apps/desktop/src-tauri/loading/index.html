<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doto Skill</title>
<style>html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0f1115;color:#e6e8ee;display:grid;place-items:center}
.box{text-align:center}.dot{width:12px;height:12px;border-radius:50%;background:#ff7a1a;display:inline-block;animation:p 1s infinite alternate}
@keyframes p{to{opacity:.2}}@media (prefers-color-scheme:light){html,body{background:#f6f7f9;color:#1b1e24}}</style></head>
<body><div class="box"><div class="dot"></div><p>Đang khởi động máy chủ Doto Skill…</p></div></body></html>
