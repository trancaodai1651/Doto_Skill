[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/system",
  "crates/media",
  "crates/skills",
  "crates/integrations",
  "crates/server",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/trancaodai1651/Doto_Skill"
rust-version = "1.85"

[workspace.dependencies]
doto-core = { path = "crates/core" }
doto-system = { path = "crates/system" }
doto-media = { path = "crates/media" }
doto-skills = { path = "crates/skills" }
doto-integrations = { path = "crates/integrations" }
doto-server = { path = "crates/server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
directories = "5"
sysinfo = "0.33"
walkdir = "2"
notify = "7"
notify-debouncer-full = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
flate2 = "1"
tar = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header", "limit"] }
argon2 = "0.5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
ipnet = "2"
regex = "1"
tempfile = "3"
which = "7"
mime_guess = "2"
clap = { version = "4", features = ["derive", "env"] }
if-addrs = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
